<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>التصنيفات — مدونة Abdallah Abas</title>
<meta name="description" content="تصفح مقالات مدونة Abdallah Abas حسب التصنيف: تطوير الويب، SEO، التصميم، وريادة الأعمال.">
<link rel="canonical" href="https://blog.abdallahabas.com/categories.html">
<link rel="icon" href="assets/img/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="categories">

<div id="app-header"></div>

<main id="main">
  <section class="page-head">
    <div class="container">
      <nav class="breadcrumb">
        <a href="index.html">الرئيسية</a>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg>
        <span>التصنيفات</span>
      </nav>
      <h1>تصفّح حسب التصنيف</h1>
      <p>اختر المجال الذي يهمك واكتشف المقالات المرتبطة به.</p>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="grid grid-cats" id="catsGrid"></div>
    </div>
  </section>
</main>

<div id="app-footer"></div>

<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  const db = AAB.DB.get();
  const pub = AAB.published();
  const cats = db.categories.slice().sort((a, b) => a.order - b.order);

  document.getElementById('catsGrid').innerHTML = cats.map(c => {
    const n = pub.filter(p => p.categoryId === c.id).length;
    return `<a class="cat-card" href="category.html?slug=${encodeURIComponent(c.slug)}">
      <span class="cat-icon" style="--c:${c.color || 'var(--brand)'}">${AAB.catIcon(c.icon)}</span>
      <h3>${AAB.esc(c.name)}</h3>
      <p>${AAB.esc(c.description || '')}</p>
      <span class="cat-count">${n} مقال</span>
    </a>`;
  }).join('') || '<p class="empty-inline">لا توجد تصنيفات بعد.</p>';

  AAB.setSEO({
    title: 'التصنيفات — ' + db.settings.siteName,
    description: 'تصفح مقالات مدونة Abdallah Abas حسب التصنيف.',
    canonical: AAB.SITE + '/categories.html',
    schema: {
      "@context":"https://schema.org",
      "@type":"CollectionPage",
      "name":"التصنيفات",
      "url": AAB.SITE + '/categories.html',
      "inLanguage":"ar"
    }
  });
});
</script>
</body>
</html>
