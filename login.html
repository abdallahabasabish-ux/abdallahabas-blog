<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>تسجيل الدخول — Abdallah Abas</title>
<link rel="icon" href="assets/img/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* =========================================================
   Auth Page — Standalone Styles
   ========================================================= */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:"IBM Plex Sans Arabic","Segoe UI",system-ui,-apple-system,sans-serif;
  background:#FAFAFB;
  color:#0A0A0A;
  line-height:1.7;
  -webkit-font-smoothing:antialiased;
}
:root{
  --brand:#FF5A00;
  --brand-600:#E24E00;
  --brand-50:#FFF3EC;
  --ink:#0A0A0A;
  --muted:#6B6B72;
  --line:#E9E9EE;
  --line-2:#DEDEE4;
  --ease:cubic-bezier(.2,.7,.2,1);
  --sh-3:0 20px 40px -12px rgba(10,10,10,.12),0 8px 16px -8px rgba(10,10,10,.06);
}

/* ============ Layout ============ */
.auth-layout{display:grid;grid-template-columns:1fr 1fr;min-height:100vh}

/* ============ Brand Panel ============ */
.auth-brand-panel{
  background:linear-gradient(150deg,#0A0A0A 0%,#1C1C1E 60%,#2A2A2E 100%);
  color:#fff;
  padding:60px 48px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  position:relative;
  overflow:hidden;
}
.auth-brand-panel::before{
  content:"";
  position:absolute;
  inset-inline-end:-120px;
  top:-120px;
  width:400px;
  height:400px;
  background:radial-gradient(circle,rgba(255,90,0,.25),transparent 65%);
  border-radius:50%;
  pointer-events:none;
}
.auth-brand-content{position:relative;z-index:1}
.auth-brand-logo{
  width:180px;
  height:auto;
  filter:brightness(0) invert(1);
  margin-bottom:60px;
}
.auth-brand-label{
  display:inline-block;
  padding:6px 14px;
  background:rgba(255,90,0,.15);
  color:#FF8C42;
  border-radius:999px;
  font-size:.8rem;
  font-weight:600;
  margin-bottom:20px;
  border:1px solid rgba(255,90,0,.3);
}
.auth-brand-name{
  font-size:clamp(2rem,4vw,3rem);
  font-weight:800;
  line-height:1.15;
  margin:0 0 24px;
  letter-spacing:-.02em;
}
.auth-brand-name span{display:block}
.auth-brand-name span:last-child{color:var(--brand)}
.auth-brand-line{width:60px;height:4px;background:var(--brand);border-radius:3px;margin-bottom:24px}
.auth-brand-desc{
  font-size:1.05rem;
  color:rgba(255,255,255,.65);
  max-width:38ch;
  line-height:1.85;
  margin:0;
}
.auth-brand-copy{
  position:relative;
  z-index:1;
  font-size:.82rem;
  color:rgba(255,255,255,.4);
  margin:0;
}

/* ============ Form Panel ============ */
.auth-form-panel{
  display:flex;
  align-items:center;
  justify-content:center;
  padding:60px 40px;
  background:#fff;
}
.auth-form-wrapper{width:100%;max-width:400px}
.auth-mobile-brand{display:none;font-size:1.3rem;font-weight:700;text-align:center;margin-bottom:24px;color:var(--ink)}
.auth-mobile-brand span:last-child{color:var(--brand)}

.auth-title{font-size:clamp(1.5rem,3vw,1.85rem);font-weight:700;margin:0 0 8px;text-align:center;color:var(--ink)}
.auth-subtitle{text-align:center;color:var(--muted);font-size:.95rem;margin:0 0 32px}

/* ============ Message ============ */
.auth-message{
  display:none;
  padding:12px 16px;
  border-radius:10px;
  font-size:.9rem;
  margin-bottom:20px;
  line-height:1.6;
}
.auth-message--visible{display:block}
.auth-message--error{background:#FFEBEE;color:#C62828;border:1px solid #FFCDD2}
.auth-message--success{background:#E8F5E9;color:#2E7D32;border:1px solid #C8E6C9}

/* ============ Form ============ */
.form-group{margin-bottom:18px}
.form-label{display:block;font-size:.88rem;font-weight:600;margin-bottom:8px;color:var(--ink)}
.form-input{
  width:100%;
  padding:13px 16px;
  border:1.5px solid var(--line);
  border-radius:12px;
  background:#fff;
  font-family:inherit;
  font-size:.95rem;
  transition:border-color .18s,box-shadow .18s;
  outline:0;
  color:var(--ink);
}
.form-input:focus{border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-50)}
.form-input--error{border-color:#E53935!important;box-shadow:0 0 0 4px rgba(229,57,53,.1)!important}

.password-wrapper{position:relative}
.password-toggle{
  position:absolute;
  inset-inline-end:12px;
  top:50%;
  transform:translateY(-50%);
  width:36px;
  height:36px;
  border-radius:8px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  color:var(--muted);
  background:none;
  border:0;
  cursor:pointer;
  padding:0;
}
.password-toggle:hover{background:#F4F4F6;color:var(--ink)}

.field-error{
  display:none;
  font-size:.82rem;
  color:#D32F2F;
  margin-top:6px;
  min-height:1.2em;
}
.field-error--visible{display:block}

/* ============ Button ============ */
.auth-btn{
  width:100%;
  padding:14px 22px;
  background:var(--brand);
  color:#fff;
  border:0;
  border-radius:999px;
  font-family:inherit;
  font-size:1rem;
  font-weight:700;
  cursor:pointer;
  position:relative;
  transition:background .18s,transform .18s,box-shadow .18s;
  box-shadow:0 12px 28px -10px rgba(255,90,0,.45);
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:10px;
}
.auth-btn:hover:not(:disabled){background:var(--brand-600);transform:translateY(-1px)}
.auth-btn:active:not(:disabled){transform:translateY(0)}
.auth-btn:disabled{opacity:.7;cursor:not-allowed}
.btn-text{position:relative;z-index:1}
.btn-loader{
  display:none;
  width:16px;
  height:16px;
  border:2px solid rgba(255,255,255,.3);
  border-top-color:#fff;
  border-radius:50%;
  animation:spin .7s linear infinite;
}
.auth-btn.is-loading .btn-loader{display:inline-block}
.auth-btn.is-loading .btn-text{opacity:.6}
@keyframes spin{to{transform:rotate(360deg)}}

/* ============ Links ============ */
.auth-link{
  display:block;
  text-align:center;
  font-size:.88rem;
  color:var(--brand);
  font-weight:600;
  margin-top:18px;
}
.auth-link:hover{text-decoration:underline}
.auth-link-row{
  text-align:center;
  font-size:.9rem;
  color:var(--muted);
  margin-top:26px;
  padding-top:22px;
  border-top:1px solid var(--line);
}
.auth-link-row a{color:var(--brand);font-weight:600;margin-inline-start:4px}
.auth-link-row a:hover{text-decoration:underline}

/* ============ Divider ============ */
.auth-divider{display:flex;align-items:center;gap:12px;margin:22px 0}
.auth-divider-line{flex:1;height:1px;background:var(--line)}
.auth-divider-text{font-size:.78rem;color:var(--muted);white-space:nowrap}

/* ============ Social buttons ============ */
.social-buttons-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.social-btn{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  padding:11px 16px;
  border-radius:12px;
  border:1.5px solid var(--line);
  background:#fff;
  color:var(--ink);
  font-family:inherit;
  font-size:.88rem;
  font-weight:600;
  cursor:pointer;
  transition:border-color .18s,background .18s,color .18s;
}
.social-btn:hover:not(:disabled){border-color:var(--brand);color:var(--brand)}
.social-btn:disabled{opacity:.6;cursor:not-allowed}
.social-btn svg{flex-shrink:0}

/* ============ Animations ============ */
.auth-animate-in{animation:fadeUp .5s var(--ease) both}
@keyframes fadeUp{
  from{opacity:0;transform:translateY(10px)}
  to{opacity:1;transform:translateY(0)}
}

/* ============ Responsive ============ */
@media (max-width:900px){
  .auth-layout{grid-template-columns:1fr}
  .auth-brand-panel{display:none}
  .auth-mobile-brand{display:block}
  .auth-form-panel{padding:40px 22px;min-height:100vh}
}

@media (max-width:480px){
  .social-buttons-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div class="auth-layout">

  <!-- ============ BRAND PANEL ============ -->
  <div class="auth-brand-panel" aria-hidden="true">
    <div class="auth-brand-content">
      <img src="assets/img/logo.svg" alt="Abdallah Abas" class="auth-brand-logo">
      <span class="auth-brand-label">حلول رقمية</span>
      <h2 class="auth-brand-name">
        <span>Abdallah</span>
        <span>Abas</span>
      </h2>
      <div class="auth-brand-line"></div>
      <p class="auth-brand-desc">
        لوحة إدارة المدونة — تحكم كامل في المقالات والتصنيفات والإعدادات.
      </p>
    </div>
    <p class="auth-brand-copy">© <span id="year"></span> Abdallah Abas</p>
  </div>

  <!-- ============ FORM PANEL ============ -->
  <main class="auth-form-panel">
    <div class="auth-form-wrapper">

      <div class="auth-mobile-brand">
        Abdallah <span>Abas</span>
      </div>

      <h1 class="auth-title auth-animate-in">تسجيل الدخول</h1>
      <p class="auth-subtitle auth-animate-in">لوحة إدارة المدونة</p>

      <div id="authMessage" class="auth-message" role="alert" aria-live="polite"></div>

      <!-- ===== Login Form ===== -->
      <form id="loginForm" class="auth-form auth-animate-in" novalidate>
        <div class="form-group">
          <label for="email" class="form-label">البريد الإلكتروني</label>
          <input
            type="email"
            id="email"
            name="email"
            class="form-input"
            autocomplete="email"
            required
            spellcheck="false"
            autofocus
            placeholder="admin@abdallahabas.com"
          >
          <div id="emailError" class="field-error" aria-live="polite"></div>
        </div>

        <div class="form-group">
          <label for="password" class="form-label">كلمة المرور</label>
          <div class="password-wrapper">
            <input
              type="password"
              id="password"
              name="password"
              class="form-input"
              autocomplete="current-password"
              required
              minlength="6"
              placeholder="••••••••"
            >
            <button type="button" id="passwordToggle" class="password-toggle" aria-label="إظهار كلمة المرور"></button>
          </div>
          <div id="passwordError" class="field-error" aria-live="polite"></div>
        </div>

        <button type="submit" class="auth-btn" id="submitBtn">
          <span class="btn-text">تسجيل الدخول</span>
          <span class="btn-loader" aria-hidden="true"></span>
        </button>
      </form>

      <!-- ===== Divider ===== -->
      <div class="auth-divider auth-animate-in">
        <span class="auth-divider-line"></span>
        <span class="auth-divider-text">أو</span>
        <span class="auth-divider-line"></span>
      </div>

      <!-- ===== Social buttons ===== -->
      <div class="social-buttons-grid auth-animate-in">
        <button type="button" id="googleLoginBtn" class="social-btn">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 48 48">
            <path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"/>
            <path fill="#FF3D00" d="m6.306 14.691 6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 16.318 4 9.656 8.337 6.306 14.691z"/>
            <path fill="#4CAF50" d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238A11.91 11.91 0 0 1 24 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z"/>
            <path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303a12.04 12.04 0 0 1-4.087 5.571l.003-.002 6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z"/>
          </svg>
          Google
        </button>
        <button type="button" id="githubLoginBtn" class="social-btn">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24">
            <path fill="currentColor" d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385c.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.15 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.62.24 2.85.12 3.15.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/>
          </svg>
          GitHub
        </button>
      </div>

      <a href="#" id="forgotPasswordLink" class="auth-link auth-animate-in">نسيت كلمة المرور؟</a>

    </div>
  </main>

</div>

<!-- =========================================================
     Scripts
     ========================================================= -->
<script type="module">
import { auth } from "./assets/js/firebase-init.js";
import {
  signInWithEmailAndPassword,
  GoogleAuthProvider,
  GithubAuthProvider,
  signInWithPopup,
  sendPasswordResetEmail,
  onAuthStateChanged,
  getIdTokenResult
} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";

/* =========================================================
   Elements
   ========================================================= */
const form = document.getElementById("loginForm");
const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const passwordToggle = document.getElementById("passwordToggle");
const submitBtn = document.getElementById("submitBtn");
const msgContainer = document.getElementById("authMessage");
const googleBtn = document.getElementById("googleLoginBtn");
const githubBtn = document.getElementById("githubLoginBtn");
const forgotLink = document.getElementById("forgotPasswordLink");

document.getElementById("year").textContent = new Date().getFullYear();

/* =========================================================
   Helpers
   ========================================================= */
function showMessage(text, type = "error") {
  msgContainer.textContent = text;
  msgContainer.className = "auth-message auth-message--visible auth-message--" + type;
}
function clearMessage() {
  msgContainer.textContent = "";
  msgContainer.className = "auth-message";
}
function showFieldError(id, msg) {
  const el = document.getElementById(id);
  if (!el) return;
  el.textContent = msg;
  el.classList.add("field-error--visible");
}
function clearFieldError(id) {
  const el = document.getElementById(id);
  if (!el) return;
  el.textContent = "";
  el.classList.remove("field-error--visible");
}
function setInputError(input, hasError) {
  input.classList.toggle("form-input--error", hasError);
  input.setAttribute("aria-invalid", hasError ? "true" : "false");
}
function setButtonLoading(btn, loading) {
  btn.disabled = loading;
  btn.classList.toggle("is-loading", loading);
}
function validateEmail(email) {
  if (!email) return { valid: false, message: "البريد الإلكتروني مطلوب." };
  const re = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
  if (!re.test(email)) return { valid: false, message: "صيغة البريد غير صحيحة." };
  return { valid: true };
}
function validatePassword(pw) {
  if (!pw) return { valid: false, message: "كلمة المرور مطلوبة." };
  if (pw.length < 6) return { valid: false, message: "كلمة المرور قصيرة جدًا (6 أحرف على الأقل)." };
  return { valid: true };
}
function mapError(code) {
  const map = {
    "auth/invalid-email": "البريد الإلكتروني غير صحيح.",
    "auth/user-disabled": "هذا الحساب معطّل.",
    "auth/user-not-found": "البريد أو كلمة المرور غير صحيحة.",
    "auth/wrong-password": "البريد أو كلمة المرور غير صحيحة.",
    "auth/invalid-credential": "البريد أو كلمة المرور غير صحيحة.",
    "auth/invalid-login-credentials": "البريد أو كلمة المرور غير صحيحة.",
    "auth/too-many-requests": "محاولات كثيرة. حاول بعد قليل.",
    "auth/network-request-failed": "تحقق من اتصالك بالإنترنت.",
    "auth/popup-closed-by-user": "أُغلقت النافذة قبل الإكمال.",
    "auth/popup-blocked": "المتصفح منع النافذة. اسمح بها وحاول مجددًا.",
    "auth/account-exists-with-different-credential": "هذا البريد مسجّل بمزوّد آخر.",
    "auth/operation-not-allowed": "هذه الطريقة غير مفعّلة في Firebase.",
    "auth/unauthorized-domain": "الدومين غير مصرّح به في Firebase."
  };
  return map[code] || "حدث خطأ غير متوقع. حاول مرة أخرى.";
}

/* =========================================================
   Password toggle
   ========================================================= */
const eyeOpen = `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
const eyeClosed = `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`;

passwordToggle.innerHTML = eyeOpen;
passwordToggle.addEventListener("click", () => {
  const isPass = passwordInput.type === "password";
  passwordInput.type = isPass ? "text" : "password";
  passwordToggle.innerHTML = isPass ? eyeClosed : eyeOpen;
});

/* =========================================================
   Clear errors on input
   ========================================================= */
emailInput.addEventListener("input", () => {
  clearFieldError("emailError");
  setInputError(emailInput, false);
  clearMessage();
});
passwordInput.addEventListener("input", () => {
  clearFieldError("passwordError");
  setInputError(passwordInput, false);
  clearMessage();
});

/* =========================================================
   Redirect if already logged in
   ========================================================= */
let redirectDone = false;
const unsub = onAuthStateChanged(auth, async (user) => {
  if (redirectDone) return;
  if (user) {
    redirectDone = true;
    try {
      const t = await getIdTokenResult(user);
      const target = t.claims.admin ? "admin/index.html" : "index.html";
      window.location.replace(target);
    } catch (e) {
      // فشل التحقق — أظهر النموذج
    }
  } else {
    document.body.style.visibility = "visible";
  }
});
setTimeout(() => { document.body.style.visibility = "visible"; }, 1500);

/* =========================================================
   Submit
   ========================================================= */
form.addEventListener("submit", async (e) => {
  e.preventDefault();

  clearMessage();
  clearFieldError("emailError");
  clearFieldError("passwordError");
  setInputError(emailInput, false);
  setInputError(passwordInput, false);

  const email = emailInput.value.trim();
  const password = passwordInput.value;
  let hasErr = false;

  const ev = validateEmail(email);
  if (!ev.valid) {
    showFieldError("emailError", ev.message);
    setInputError(emailInput, true);
    hasErr = true;
  }
  const pv = validatePassword(password);
  if (!pv.valid) {
    showFieldError("passwordError", pv.message);
    setInputError(passwordInput, true);
    hasErr = true;
  }
  if (hasErr) {
    const first = form.querySelector(".form-input--error");
    if (first) first.focus();
    return;
  }

  setButtonLoading(submitBtn, true);
  try {
    const cred = await signInWithEmailAndPassword(auth, email, password);
    const t = await cred.user.getIdTokenResult();
    const target = t.claims.admin ? "admin/index.html" : "index.html";
    window.location.replace(target);
  } catch (err) {
    console.error("[login]", err);
    setButtonLoading(submitBtn, false);
    showMessage(mapError(err.code), "error");
    if (err.code === "auth/wrong-password" || err.code === "auth/invalid-credential") {
      setInputError(emailInput, true);
      setInputError(passwordInput, true);
    }
    emailInput.focus();
  }
});

/* =========================================================
   Google
   ========================================================= */
googleBtn.addEventListener("click", async () => {
  clearMessage();
  googleBtn.disabled = true;
  const originalHtml = googleBtn.innerHTML;
  googleBtn.innerHTML = '<span style="width:16px;height:16px;border:2px solid rgba(255,90,0,.25);border-top-color:#FF5A00;border-radius:50%;animation:spin .7s linear infinite;display:inline-block"></span> جارٍ الاتصال...';

  try {
    const provider = new GoogleAuthProvider();
    provider.setCustomParameters({ prompt: "select_account" });
    const cred = await signInWithPopup(auth, provider);
    const t = await cred.user.getIdTokenResult();
    window.location.replace(t.claims.admin ? "admin/index.html" : "index.html");
  } catch (err) {
    console.error("[google]", err);
    googleBtn.disabled = false;
    googleBtn.innerHTML = originalHtml;
    showMessage(mapError(err.code), "error");
  }
});

/* =========================================================
   Forgot password
   ========================================================= */
forgotLink.addEventListener("click", async (e) => {
  e.preventDefault();
  const email = emailInput.value.trim();
  const ev = validateEmail(email);
  if (!ev.valid) {
    showMessage("أدخل بريدك الإلكتروني أولاً لاستعادة كلمة المرور.", "error");
    emailInput.focus();
    return;
  }
  try {
    await sendPasswordResetEmail(auth, email);
    showMessage("تم إرسال رابط إعادة التعيين إلى " + email, "success");
  } catch (err) {
    console.error("[reset]", err);
    showMessage(mapError(err.code), "error");
  }
});
