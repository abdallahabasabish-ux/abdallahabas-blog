backend:
  name: github
  repo: abdallahabas/blog         # ← اسم المستودع
  branch: main
  base_url: https://sveltia-cms-auth.abdallahabas.workers.dev  # OAuth broker
  commit_messages:
    create: "content: إضافة {{collection}} — {{slug}}"
    update: "content: تعديل {{collection}} — {{slug}}"
    delete: "content: حذف {{collection}} — {{slug}}"

media_folder: "public/uploads"
public_folder: "/uploads"

locale: ar

collections:
  - name: posts
    label: "المقالات"
    label_singular: "مقال"
    folder: "src/content/posts"
    create: true
    extension: mdx
    format: frontmatter
    slug: "{{slug}}"
    preview_path: "blog/{{slug}}"
    sortable_fields: [publishedAt, title, updatedAt]
    fields:
      - { name: title, label: "العنوان", widget: string }
      - { name: slug, label: "الرابط (Slug)", widget: string, required: false }
      - { name: excerpt, label: "الوصف المختصر", widget: text }
      - { name: cover, label: "الصورة الرئيسية", widget: image }
      - { name: coverAlt, label: "Alt Text للصورة", widget: string, required: true }
      - { name: category, label: "التصنيف", widget: relation, collection: categories, search_fields: [name], value_field: "{{slug}}" }
      - { name: tags, label: "الوسوم", widget: list, default: [] }
      - { name: author, label: "الكاتب", widget: relation, collection: authors, value_field: "{{slug}}" }
      - { name: publishedAt, label: "تاريخ النشر", widget: datetime }
      - { name: updatedAt, label: "تاريخ التحديث", widget: datetime, required: false }
      - { name: status, label: "الحالة", widget: select,
          options: [{label: مسودة, value: draft}, {label: منشور, value: published}, {label: مجدول, value: scheduled}, {label: مؤرشف, value: archived}] }
      - { name: featured, label: "مقال مميز", widget: boolean, default: false }
      - { name: body, label: "المحتوى", widget: markdown }

      # مجموعة SEO
      - { name: seo, label: "SEO", widget: object, collapsed: true, fields: [
          { name: metaTitle, label: "Meta Title", widget: string, required: false, hint: "60 حرفًا كحد أقصى" },
          { name: metaDescription, label: "Meta Description", widget: text, required: false, hint: "160 حرفًا" },
          { name: focusKeyword, label: "الكلمة المفتاحية الأساسية", widget: string, required: false },
          { name: secondaryKeywords, label: "كلمات مفتاحية ثانوية", widget: list, default: [] },
          { name: canonicalUrl, label: "Canonical URL", widget: string, required: false },
          { name: noindex, label: "منع الفهرسة", widget: boolean, default: false },
        ]}

      - name: faq
        label: "الأسئلة الشائعة"
        widget: list
        required: false
        fields:
          - { name: q, label: "السؤال", widget: string }
          - { name: a, label: "الإجابة", widget: text }

  - name: categories
    label: "التصنيفات"
    folder: "src/content/categories"
    extension: json
    format: json
    create: true
    slug: "{{fields.slug}}"
    fields:
      - { name: name, label: "الاسم", widget: string }
      - { name: slug, label: "Slug", widget: string }
      - { name: description, label: "الوصف", widget: text, required: false }
      - { name: image, label: "الصورة", widget: image, required: false }
      - { name: order, label: "الترتيب", widget: number, default: 0 }
      - { name: seoTitle, label: "SEO Title", widget: string, required: false }
      - { name: metaDescription, label: "Meta Description", widget: text, required: false }

  - name: authors
    label: "الكتّاب"
    folder: "src/content/authors"
    extension: json
    format: json
    create: false
    delete: false
    fields:
      - { name: name, label: "الاسم", widget: string }
      - { name: avatar, label: "الصورة", widget: image }
      - { name: bio, label: "النبذة", widget: text }
      - { name: expertise, label: "الخبرات", widget: list, default: [] }
      - { name: website, label: "الموقع", widget: string, required: false }
      - { name: social, label: "التواصل", widget: object, fields: [
          { name: twitter, label: "Twitter/X", widget: string, required: false },
          { name: linkedin, label: "LinkedIn", widget: string, required: false },
          { name: github, label: "GitHub", widget: string, required: false },
          { name: youtube, label: "YouTube", widget: string, required: false },
        ]}

  - name: pages
    label: "الصفحات"
    folder: "src/content/pages"
    extension: mdx
    format: frontmatter
    create: true
    fields:
      - { name: title, label: "العنوان", widget: string }
      - { name: slug, label: "Slug", widget: string }
      - { name: metaTitle, label: "Meta Title", widget: string, required: false }
      - { name: metaDescription, label: "Meta Description", widget: text, required: false }
      - { name: updatedAt, label: "آخر تحديث", widget: datetime, required: false }
      - { name: body, label: "المحتوى", widget: markdown }
