<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تواصل معي — مدونة Abdallah Abas</title>
<meta name="description" content="تواصل مع Abdallah Abas للاستفسار عن الخدمات، المشاريع، أو التعاون.">
<link rel="canonical" href="https://blog.abdallahabas.com/contact.html">
<link rel="icon" href="assets/img/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="contact">

<div id="app-header"></div>

<main id="main">
  <section class="page-head">
    <div class="container">
      <nav class="breadcrumb">
        <a href="index.html">الرئيسية</a>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg>
        <span>تواصل معي</span>
      </nav>
      <h1>تواصل معي</h1>
      <p>لأي استفسار عن الخدمات، المشاريع، أو التعاون — سأرد عليك في أقرب وقت.</p>
    </div>
  </section>

  <section class="section">
    <div class="container contact-grid">
      <div>
        <h2 class="section-title" style="margin-bottom:22px">أرسل رسالة</h2>
        <form id="contactForm" novalidate>
          <div class="form-grid">
            <div class="field">
              <label for="cname">الاسم الكامل *</label>
              <input id="cname" name="name" type="text" required placeholder="اسمك">
            </div>
            <div class="field">
              <label for="cemail">البريد الإلكتروني *</label>
              <input id="cemail" name="email" type="email" required placeholder="you@example.com">
            </div>
          </div>
          <div class="field">
            <label for="csubject">الموضوع</label>
            <input id="csubject" name="subject" type="text" placeholder="مثال: استفسار عن خدمة تحسين محركات البحث">
          </div>
          <div class="field">
            <label for="cmsg">الرسالة *</label>
            <textarea id="cmsg" name="message" required placeholder="اكتب رسالتك بالتفصيل…"></textarea>
          </div>
          <div class="field" style="flex-direction:row;align-items:center;gap:10px">
            <input type="checkbox" id="cprivacy" required style="width:auto">
            <label for="cprivacy" style="font-weight:500;font-size:.9rem">
              أوافق على <a href="privacy.html" style="color:var(--brand)">سياسة الخصوصية</a>.
            </label>
          </div>
          <button type="submit" class="btn btn-brand btn-lg">إرسال الرسالة</button>
          <p class="form-note" id="contactNote" role="status"></p>
        </form>
      </div>

      <aside class="contact-info">
        <div class="contact-item">
          <span class="ico">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
          </span>
          <div>
            <h4>البريد الإلكتروني</h4>
            <a id="infoEmail" href="#">—</a>
          </div>
        </div>
        <div class="contact-item">
          <span class="ico">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg>
          </span>
          <div>
            <h4>الموقع الرئيسي</h4>
            <a id="infoSite" href="#" target="_blank" rel="noopener">abdallahabas.com</a>
          </div>
        </div>
        <div class="contact-item">
          <span class="ico">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
          </span>
          <div>
            <h4>وقت الرد</h4>
            <p>عادة خلال 24 ساعة عمل.</p>
          </div>
        </div>
      </aside>
    </div>
  </section>
</main>

<div id="app-footer"></div>

<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  const db = AAB.DB.get();
  const s = db.settings;

  const emailEl = document.getElementById('infoEmail');
  emailEl.href = 'mailto:' + s.email;
  emailEl.textContent = s.email;
  document.getElementById('infoSite').href = s.storeUrl;

  const form = document.getElementById('contactForm');
  const note = document.getElementById('contactNote');

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    const data = {
      name: form.name.value.trim(),
      email: form.email.value.trim(),
      subject: form.subject.value.trim(),
      message: form.message.value.trim()
    };

    if (!data.name || !data.email || !data.message) {
      note.textContent = 'يرجى تعبئة الحقول الإلزامية.';
      note.className = 'form-note is-error';
      return;
    }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(data.email)) {
      note.textContent = 'البريد الإلكتروني غير صحيح.';
      note.className = 'form-note is-error';
      return;
    }
    if (!form.cprivacy.checked) {
      note.textContent = 'يجب الموافقة على سياسة الخصوصية.';
      note.className = 'form-note is-error';
      return;
    }

    /* NOTE: لا يوجد Backend حقيقي — يُفتح بريد العميل كحل مؤقت */
    const subject = encodeURIComponent(data.subject || ('رسالة من ' + data.name));
    const body = encodeURIComponent(data.message + '\n\n— ' + data.name + '\n' + data.email);
    window.location.href = `mailto:${s.email}?subject=${subject}&body=${body}`;

    note.textContent = 'تم فتح برنامج البريد لديك. يمكنك إرسال الرسالة الآن.';
    note.className = 'form-note is-ok';
  });

  AAB.setSEO({
    title: 'تواصل معي — ' + s.siteName,
    description: 'تواصل مع Abdallah Abas للاستفسار عن الخدمات أو المشاريع.',
    canonical: AAB.SITE + '/contact.html',
    schema: {
      "@context":"https://schema.org",
      "@type":"ContactPage",
      "name":"تواصل معي",
      "url": AAB.SITE + '/contact.html',
      "inLanguage":"ar"
    }
  });
});
</script>
</body>
</html>
